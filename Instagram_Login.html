<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="Instagram_Login.css" />
</head>
<body>
    <header>
        <img src="Instagram_logo.png" width="300px" height="80px"/>
    </header>
    <hr />
    <main>

        <div id="insta_cont">
            <div id="insta_logo">
                <img src="insta_logo.png" width="60px" height="60px" >
            </div>
            <!-- this gradient is made using gpt -->
            <h2>
             See everyday moments from your <br>
                 <span class="instagram-gradient">
                    close friends
                 </span>.
            </h2>
            <!-- ----------######----------  -->
            <img src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp" width="450px" height="350px">
        </div>


        <div id="login_side">
            <div class="login_box_content">
                <div id="heading_login">
                  <h3>Log into Instagram</h3>
                </div>
            

                 <input type="text" id="user_details" name="user_details" placeholder="Moble number , username or email">
                 
 
     
                 <input type="password" id="password" name="password" placeholder="Password" />
                 
         
                 <button id="login">Login</button>
                 
         
                 <button id="forget_pass">Forgot password?</button>
            </div>    
           
            <div class="login_box_content">
                <button id="log_facebook">
                   <img src="Face_book_log.png" width="15" height="15" alt="Facebook">
                   <span id="log_face">Log in with Facebook</span>
                </button>
                
  
                <button id="create_account">Create new account</button>
            </div>  
        
                <img src="meta1.png" width="60px" height="25px">
            
        </div>
       
    </main>
    <br />
    <hr />
